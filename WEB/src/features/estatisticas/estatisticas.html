<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estatísticas — Sentinel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../style.css" />
  </head>

  <body class="page-app page-estatisticas">
    <a href="#main-content" class="skip-link"
      >Pular para o conteúdo principal</a
    >

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar" aria-label="Menu lateral">
      <div class="sidebar-header" role="banner">
        <button
          class="menu-toggle minimize"
          aria-label="Minimizar menu"
          aria-expanded="true"
          aria-controls="sidebar"
          onclick="minimizeMenu()"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <button
          class="menu-toggle close"
          aria-label="Fechar menu"
          aria-expanded="true"
          aria-controls="sidebar"
          onclick="toggleMenu(this)"
        >
          <span aria-hidden="true">X</span>
        </button>
        <a
          href="../../index.html"
          class="logo logo--sidebar"
          aria-label="Sentinel"
          >Sentinel</a
        >
      </div>

      <nav class="sidebar-nav" aria-label="Navegação do sistema">
        <ul role="list">
          <li>
            <a href="../tarefas/tarefas.html" class="sidebar-link"
              ><span class="sidebar-icon" aria-hidden="true">⊞</span> Tarefas</a
            >
          </li>
          <li>
            <a href="../projetos/projetos.html" class="sidebar-link"
              ><span class="sidebar-icon" aria-hidden="true">◫</span>
              Projetos</a
            >
          </li>
          <li>
            <a
              href="estatisticas.html"
              class="sidebar-link active"
              aria-current="page"
              ><span class="sidebar-icon" aria-hidden="true">▦</span>
              Estatísticas</a
            >
          </li>
        </ul>
      </nav>
      <div class="user-dados sidebar-footer">
        <div class="user-info" onclick="abrirPerfil()">
          <button class="btn-user">
            <div class="user-avatar" id="sb-avatar" aria-hidden="true">-</div>
            <span class="user-name" id="sb-nome"></span>
          </button>
        </div>

        <button
          href="#"
          class="btn-user"
          aria-label="Sair da conta"
          onclick="logout()"
        >
          SAIR
        </button>
      </div>
    </aside>

    <div class="topbar" role="banner">
      <button
        class="menu-toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="sidebar"
        onclick="toggleMenu(this)"
      >
        <span aria-hidden="true">☰</span>
      </button>
      <span class="topbar-title">Sentinel</span>
    </div>

    <main class="app-main" id="main-content">
      <header class="app-header">
        <div>
          <h1>Estatísticas</h1>
          <p class="stats-subtitulo">
            Acompanhe o andamento dos projetos, tarefas e utilização de
            recursos.
          </p>
        </div>

        <nav class="app-nav">
          <a href="../../index.html#sobre">Sobre</a>
          <a href="../../index.html#contatos">Contatos</a>
        </nav>
      </header>

      <section class="stats-filtro" aria-label="Filtros de estatísticas">
        <div class="periodo-filter">
          <strong>Período:</strong>
          <button
            class="periodo-btn active"
            data-quarter="all"
            aria-pressed="true"
          >
            Todos
          </button>
          <button class="periodo-btn" data-quarter="0" aria-pressed="false">
            Janeiro — Março
          </button>
          <button class="periodo-btn" data-quarter="1" aria-pressed="false">
            Abril — Junho
          </button>
          <button class="periodo-btn" data-quarter="2" aria-pressed="false">
            Julho — Setembro
          </button>
          <button class="periodo-btn" data-quarter="3" aria-pressed="false">
            Outubro — Dezembro
          </button>
        </div>
        <label
          >Ano
          <select class="stats-data" id="stats-year"></select
        ></label>
        <button class="periodo-btn" id="stats-refresh">Atualizar dados</button>
      </section>
      <p id="stats-feedback" role="status" aria-live="polite">
        Carregando dados do servidor…
      </p>
      <div id="stats-dashboard" hidden></div>
    </main>

    <!-- MODAL EDITAR PERFIL -->
    <div
      class="overlay"
      id="perfilModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-header"
      aria-hidden="true"
    >
      <div class="modal-perfil">
        <div class="modal-header">
          <h2>Editar Perfil</h2>
          <button type="button" class="btn-user" onclick="fecharPerfil()">
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="avatar-container">
            <div class="perfil-avatar-container">
              <div class="avatar-grande" id="perfil-avatar" aria-hidden="true">
                -
              </div>
              <div class="user-name-perfil" id="perfil-nome"></div>
            </div>
          </div>

          <input
            type="text"
            id="alterar-perfil-nome"
            placeholder="Nome do usuário"
          />

          <button
            id="btnCadastro"
            class="btn btn-primary"
            onclick="location.href = '../cadastro/cadastro.html'"
            style="display: none"
          >
            Cadastrar
          </button>

          <a href="#" class="btn btn-danger" onclick="deleteAccount()"
            >Excluir Conta</a
          >
          <div class="user-info">
            <button class="btn btn-primary-alt" onclick="fecharPerfil()">
              Cancelar
            </button>
            <button class="btn btn-primary" onclick="salvarPerfil()">
              Salvar Alterações
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="estatisticas.js"></script>
  </body>
</html>
